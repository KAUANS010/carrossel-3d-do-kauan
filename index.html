<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrossel 3D - Kauan - v2</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>

    <header class="search-header">
      <label for="searchInput">Pesquisar:</label>
      <input
        type="text"
        id="searchInput"
        list="carousel-options"
        placeholder="Ex: WhatsApp [Ctrl + Enter]"
        autocomplete="off"
      />
      <datalist id="carousel-options"></datalist>
    </header>

    <main class="container">
      <section class="carousel-content" id="carousel">
        <div class="indicator"></div>
      </section>
    </main>

    <script src="index.js" defer></script>
  </body>
</html>
